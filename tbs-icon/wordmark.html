<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trippy Bento Studio — wordmark</title>
<style>
  :root {
    --plum: #a86fd0;
    --ink: #2e1b47;
    --paper: #f5f3ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 3rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font: 400 14px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage {
    padding: 2.5rem;
    border-radius: 4px;
    background: var(--paper);
    transition: background 120ms linear;
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: center;
  }
  #stage.dark { background: #1b1226; }
  #stage.checker {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #e3e0d9 25%, transparent 25%, transparent 75%, #e3e0d9 75%),
      linear-gradient(45deg, #e3e0d9 25%, transparent 25%, transparent 75%, #e3e0d9 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100%;
    height: auto;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button {
    font: inherit;
    padding: 7px 14px;
    border: 1px solid var(--ink);
    border-radius: 3px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: rgba(46, 27, 71, 0.07); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
  p.note { max-width: 46ch; text-align: center; opacity: 0.65; font-size: 12px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { canvas { animation: none; } }
</style>
</head>
<body>

<div id="stage" class="checker"><canvas id="wm" width="101" height="22"></canvas></div>

<div class="controls">
  <button id="replay">Replay</button>
  <button id="lockup">Lockup: horizontal</button>
  <button id="pal">Outline: plum</button>
  <button id="bg">Background: checker</button>
  <button id="save">Save frame as PNG</button>
</div>

<p class="note">Everything here is drawn on a 1px grid. Scale by whole numbers only — 2×, 3×, 4×. Any fractional scale will blur the outline.</p>

<script>
const BASE = {
  K:'#2e1b47', P:'#a86fd0', L:'#c99ae8', D:'#7d4aa6', W:'#fdfdff', S:'#fdfdff',
  N:'#2e1b47', R:'#e8453c', r:'#ff7a63', O:'#f2a13a', E:'#4fae5a', e:'#388144',
  c:'#ff8fbe', B:'#241634', T:'#2e1b47'
};
const INK = Object.assign({}, BASE, { K:'#2e2013', N:'#2e2013', B:'#2e2013', T:'#2e2013' });
const DRIFT = ['P','L','D'];

const ICON = [
"........................",".............RR.........","............RrrR........",
"...KKKK.....RrrR...EEE..","..KWWWWK...RRrrRR.EeEEE.",".KWWSWWWK..RrrrrR.EEEEe.",
".KWWWWWWWK.RRrrRR.EEEEe.",".KWWWWWWWK.RrrrR.OOEEEE.",".KNNNNNNNK.RRRR.OOOOOOO.",
"KKKKKKKKKKKKKKKKKKKKKKKK","KLLLLLLLLLLLLLLLLLLLLLLK","KPPPPPPPPPPPPPPPPPPPPPPK",
"KPPPPBBBPPPPPPPPPBBBPPPK","KPcPPBSBPPPKKPPPPBSBPcPK","KPcPPBBBPPPKKPPPPBBBPcPK",
"KPPPPPPPPPPPPPPPPPPPPPPK","KDDDDDDDDDDDDDDDDDDDDDDK","KKKKKKKKKKKKKKKKKKKKKKKK",
"..KK...............KK..."];

const FONT = {
  T:["11111","00100","00100","00100","00100","00100","00100"],
  R:["11110","10001","10001","11110","10100","10010","10001"],
  I:["11111","00100","00100","00100","00100","00100","11111"],
  P:["11110","10001","10001","11110","10000","10000","10000"],
  Y:["10001","10001","01010","00100","00100","00100","00100"],
  B:["11110","10001","10001","11110","10001","10001","11110"],
  E:["11111","10000","10000","11110","10000","10000","11111"],
  N:["10001","11001","10101","10101","10011","10001","10001"],
  O:["01110","10001","10001","10001","10001","10001","01110"],
  S:["01111","10000","10000","01110","00001","00001","11110"],
  U:["10001","10001","10001","10001","10001","10001","01110"],
  D:["11110","10001","10001","10001","10001","10001","11110"],
  " ":["00000","00000","00000","00000","00000","00000","00000"]
};

const LOCKUPS = {
  horizontal: { w:101, h:22, icon:[0,2], lines:[["TRIPPY BENTO",30,4],["STUDIO",30,15]] },
  stacked:    { w:71,  h:37, icon:[23,0], lines:[["TRIPPY BENTO",0,21],["STUDIO",18,30]] },
  short:      { w:101, h:19, icon:[0,0],  lines:[["TRIPPY BENTO",30,6]] }
};

const FPS = 24, TOTAL = 72, L1_START = 10, L1_STEP = 2, L2_START = 36, L2_STEP = 2;
const ICON_IN = 4, BLINK_FROM = 58, BLINK_TO = 60;

const cv = document.getElementById('wm'), cx = cv.getContext('2d');
let lockup = 'horizontal', pal = BASE, palName = 'plum', bgMode = 'checker', start = performance.now();

function hueShift(hex, d) {
  if (!d) return hex;
  const n = parseInt(hex.slice(1), 16);
  let r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const dd = mx - mn;
    s = l > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
    h = mx === r ? (g - b) / dd + (g < b ? 6 : 0) : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;
    h /= 6;
  }
  h = (h + d + 1) % 1;
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = u => { u = (u + 1) % 1;
    const v = u < 1/6 ? p + (q - p) * 6 * u : u < 0.5 ? q : u < 2/3 ? p + (q - p) * (2/3 - u) * 6 : p;
    return Math.round(v * 255); };
  return `rgb(${f(h + 1/3)},${f(h)},${f(h - 1/3)})`;
}

function px(x, y, col) { cx.fillStyle = col; cx.fillRect(x, y, 1, 1); }

function drawIcon(ox, oy, blink, d) {
  for (let y = 0; y < ICON.length; y++) for (let x = 0; x < ICON[y].length; x++) {
    const k = ICON[y][x];
    if (k === '.') continue;
    if (blink && y >= 12 && y <= 14 && (k === 'B' || k === 'S')) {
      if (y === 13) px(ox + x, oy + y, pal.B);
      continue;
    }
    px(ox + x, oy + y, DRIFT.includes(k) ? hueShift(pal[k], d) : pal[k]);
  }
}

function drawText(s, ox, oy, f, start, step) {
  for (let i = 0; i < s.length; i++) {
    const at = start + i * step;
    if (f < at) break;
    const g = FONT[s[i]]; if (!g) continue;
    const dy = f === at ? -1 : 0;
    for (let gy = 0; gy < 7; gy++) for (let gx = 0; gx < 5; gx++)
      if (g[gy][gx] === '1') px(ox + i * 6 + gx, oy + gy + dy, pal.T);
  }
}

function render(f) {
  const L = LOCKUPS[lockup];
  cv.width = L.w; cv.height = L.h;
  cx.clearRect(0, 0, L.w, L.h);
  const d = 0.02 * Math.sin(2 * Math.PI * f / TOTAL);
  if (f >= ICON_IN) {
    const bump = f < ICON_IN + 2 ? 1 : 0;
    drawIcon(L.icon[0], L.icon[1] + bump, f >= BLINK_FROM && f <= BLINK_TO, d);
  }
  drawText(L.lines[0][0], L.lines[0][1], L.lines[0][2], f, L1_START, L1_STEP);
  if (L.lines[1]) drawText(L.lines[1][0], L.lines[1][1], L.lines[1][2], f, L2_START, L2_STEP);
}

function tick(now) {
  render(Math.floor(((now - start) / 1000 * FPS)) % TOTAL);
  requestAnimationFrame(tick);
}

const stage = document.getElementById('stage');
document.getElementById('replay').onclick = () => { start = performance.now(); };
document.getElementById('lockup').onclick = e => {
  const order = ['horizontal', 'stacked', 'short'];
  lockup = order[(order.indexOf(lockup) + 1) % order.length];
  e.target.textContent = 'Lockup: ' + lockup;
  start = performance.now();
};
document.getElementById('pal').onclick = e => {
  const isPlum = palName === 'plum';
  pal = isPlum ? INK : BASE; palName = isPlum ? 'ink' : 'plum';
  e.target.textContent = 'Outline: ' + palName;
};
document.getElementById('bg').onclick = e => {
  const order = ['checker', 'paper', 'dark'];
  bgMode = order[(order.indexOf(bgMode) + 1) % order.length];
  stage.className = bgMode === 'paper' ? '' : bgMode;
  e.target.textContent = 'Background: ' + bgMode;
};
document.getElementById('save').onclick = () => {
  const L = LOCKUPS[lockup], k = 8;
  const o = document.createElement('canvas');
  o.width = L.w * k; o.height = L.h * k;
  const octx = o.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(cv, 0, 0, o.width, o.height);
  const a = document.createElement('a');
  a.download = `tbs-${lockup}-${palName}@${k}x.png`;
  a.href = o.toDataURL('image/png');
  a.click();
};

requestAnimationFrame(tick);
</script>
</body>
</html>
